# How to use this project
# How to use this project
usage: |-
  ### Quick start
  Configure the AWS provider in your root module and pass a VPC and subnet from the same region.

  ```hcl
  module "ec2" {
    source  = "clouddrove/ec2/aws"
    version = "2.1.1"

    name        = "app"
    environment = "dev"
    vpc_id      = "vpc-xxxxxxxx"
    subnet_ids  = ["subnet-xxxxxxxx"]

    instance_count = 1
    instance_configuration = {
      ami = {
        type         = "al2023"
        architecture = "x86_64"
        region       = "us-east-1"
      }
      instance_type = "t3.micro"
    }

    enable_key_pair    = false
    assign_eip_address = false
  }
  ```

  No inbound access is configured by default. For SSH, set `ssh_allowed_ip` to a trusted CIDR (such as your office/VPN IP with `/32`) and use port 22. Avoid `0.0.0.0/0`. AMI lookup uses the AWS provider region; `ami.region` does not select a region. See `examples/` for complete network, IAM, EBS, and Spot configurations.
